[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "babycam"
version = "0.1.0"
description = "A small desktop CAM tool for 2.5D profile cuts"
requires-python = ">=3.11"
dependencies = [
    "ezdxf>=1.4,<2",
    "PySide6-Essentials>=6.8,<7",
    "shapely>=2,<3",
]

[project.scripts]
babycam = "babycam.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
